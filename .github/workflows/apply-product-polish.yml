name: Apply v1.7.1 product polish
on:
  push:
    branches: [product-polish-v1.7.1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tools/.polish2 -name 'p*.b64' | wc -l)" -eq 20
          cat tools/.polish2/p*.b64 | base64 -d > /tmp/product-polish.patch
          echo 'c3357dbf4dff21b909b339d8fe4fdb674e68d0cb9704ee7dec43d33f3141e43e  /tmp/product-polish.patch' | sha256sum -c -
          git apply --check /tmp/product-polish.patch
          git apply /tmp/product-polish.patch
          gofmt -w source/app_windows.go source/mode.go source/mode_test.go source/failure_matrix_test.go
          # The normal GITHUB_TOKEN cannot mutate workflow files. Keep their current branch
          # versions in this commit; the reviewed v1.7.1 workflow changes are applied separately
          # by the repository connector after this product commit succeeds.
          git checkout -- .github/workflows/build.yml .github/workflows/release.yml
      - name: Commit product change without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/.polish tools/.polish2
          git config user.name 'JetSmileOK automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Polish LangTint v1.7.1 installer UX'
          git push origin HEAD:product-polish-v1.7.1
