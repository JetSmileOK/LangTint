name: Build Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Test
        working-directory: source
        run: |
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...

      - name: Build Windows x64
        working-directory: source
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../TaskbarLayoutTint_v1_5_3.exe .

      - name: Package
        run: |
          mkdir -p dist
          cp TaskbarLayoutTint_v1_5_3.exe dist/
          cp TaskbarLayoutTint_v1_5_3.exe.manifest dist/
          cp RUN_ALL_AND_INSTALL.cmd STATUS.cmd UNINSTALL.cmd README_RU.txt BUILD_ID.txt dist/
          (cd dist && zip -9 TaskbarLayoutTint_COMPOSITION_CURSOR_v1_5_3_Win10.zip \
            TaskbarLayoutTint_v1_5_3.exe \
            TaskbarLayoutTint_v1_5_3.exe.manifest \
            RUN_ALL_AND_INSTALL.cmd STATUS.cmd UNINSTALL.cmd README_RU.txt BUILD_ID.txt)

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarLayoutTint-v1.5.3-Win10-x64
          path: |
            dist/TaskbarLayoutTint_COMPOSITION_CURSOR_v1_5_3_Win10.zip
            dist/TaskbarLayoutTint_v1_5_3.exe
          if-no-files-found: error
