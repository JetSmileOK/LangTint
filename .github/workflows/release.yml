name: Prepare LangTint release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact vMAJOR.MINOR.PATCH matching packaging/release.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.1'
  INNO_TAG: 'is-7_1_0'
  INNO_ASSET: 'innosetup-7.1.0-x64.exe'
  INNO_SHA256: '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: release
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Validate requested version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $version = python tools/release.py config version
          if ($env:REQUESTED_TAG -ne "v$version") { throw "Tag must equal v$version" }
          git rev-parse --verify "refs/tags/$env:REQUESTED_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-list -n 1 $env:REQUESTED_TAG
            if ($tagCommit -ne $env:GITHUB_SHA) { throw 'Existing tag points to another commit' }
          }

      - name: Full source, installer and runtime gates
        shell: pwsh
        run: |
          python tools/release.py verify-source
          python tools/generate_icon.py
          python tools/release.py verify-installer
          python -m unittest discover -s tools -p "test_*.py" -v
          Push-Location source
          go test -count=100 ./...
          if ($LASTEXITCODE) { throw 'Go test x100 failed' }
          go vet ./...
          if ($LASTEXITCODE) { throw 'Go vet failed' }
          Pop-Location

      - name: Build LangTint.exe
        working-directory: source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\build | Out-Null
          go build -buildvcs=false -trimpath -ldflags="-H=windowsgui -s -w" -o ..\build\LangTint.exe .
          if ($LASTEXITCODE) { throw 'Go build failed' }

      - name: Stage deterministic portable ZIP
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -c "from pathlib import Path; import sys; sys.path.insert(0,'tools'); import release; release.check_pe(Path('build/LangTint.exe'))"
          python tools/release.py stage --binary build/LangTint.exe --output stage --commit "$env:SOURCE_COMMIT"
          python tools/release.py package --stage stage --output dist

      - name: Bootstrap verified Inno Setup 7.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .inno | Out-Null
          gh release download $env:INNO_TAG --repo jrsoftware/issrc --pattern $env:INNO_ASSET --dir .inno
          if ($LASTEXITCODE) { throw 'Unable to download pinned Inno Setup release asset' }
          $asset = Join-Path $PWD ".inno\$env:INNO_ASSET"
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) { throw "Inno Setup SHA-256 mismatch: $actual" }
          $sig = Get-AuthenticodeSignature $asset
          if ($sig.Status -ne 'Valid') { throw "Inno Setup Authenticode status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw "Unexpected Inno Setup publisher: $($sig.SignerCertificate.Subject)" }
          $p = Start-Process -FilePath $asset -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install exit code $($p.ExitCode)" }
          $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter ISCC.exe -File -Recurse | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after verified Inno Setup installation' }
          "ISCC_PATH=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile LangTint Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\installer\build | Out-Null
          Copy-Item build\LangTint.exe packaging\installer\build\LangTint.exe
          Copy-Item packaging\windows\LangTint.exe.manifest packaging\installer\build\LangTint.exe.manifest
          & "$env:ISCC_PATH" /Qp packaging\installer\LangTint.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exit code $LASTEXITCODE" }
          $setup = 'packaging\installer\output\LangTint-Setup-x64.exe'
          if (-not (Test-Path $setup)) { throw 'Installer output missing' }
          python -c "from pathlib import Path; import sys; sys.path.insert(0,'tools'); import release; release.check_pe(Path(r'$setup'))"
          $sig = Get-AuthenticodeSignature $setup
          if ($sig.Status -notin @('NotSigned','UnknownError')) { throw "Unexpected preview signing state: $($sig.Status)" }
          Copy-Item $setup dist\LangTint-Setup-x64.exe

      - name: Final release hashes
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'dist\SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
          Get-Content dist\SHA256SUMS.txt

      - name: Create draft prerelease only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:REQUESTED_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite it' }
          @"
          Unsigned Windows 10 x64 release candidate.

          Recommended download: LangTint-Setup-x64.exe
          Advanced/portable: LangTint-v1.7.0-Windows10-x64-unsigned.zip

          Built from commit $env:GITHUB_SHA.
          Source hashes, 100x runtime tests, installer policy tests and Windows x64 build passed in CI.
          SignPath is not active yet; Windows may warn about an unknown publisher.
          This draft must pass real Windows 10 desktop acceptance before promotion to stable.
          "@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $env:REQUESTED_TAG dist\LangTint-Setup-x64.exe dist\LangTint-v1.7.0-Windows10-x64-unsigned.zip dist\SHA256SUMS.txt --target $env:GITHUB_SHA --draft --prerelease --title "LangTint $env:REQUESTED_TAG - installer release candidate" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Draft release creation failed' }
