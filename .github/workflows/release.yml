name: Prepare LangTint release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact vMAJOR.MINOR.PATCH matching packaging/release.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.1'
  PYTHONUTF8: '1'
  INNO_TAG: 'is-7_1_0'
  INNO_ASSET: 'innosetup-7.1.0-x64.exe'
  INNO_SHA256: '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: release
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Validate requested version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $version = python tools/release.py config version
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read release version' }
          if ($env:REQUESTED_TAG -ne "v$version") { throw "Tag must equal v$version" }
          # Missing tags are normal for a first release. Keep LASTEXITCODE zero:
          # the Actions pwsh wrapper propagates it when this step finishes.
          $existingTag = git tag --list -- $env:REQUESTED_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect Git tags' }
          if ($existingTag) {
            $tagCommit = git rev-parse --verify "refs/tags/$($env:REQUESTED_TAG)^{commit}"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve existing tag to a commit' }
            if ($tagCommit -ne $env:GITHUB_SHA) { throw 'Existing tag points to another commit' }
          }

      - name: Full source, installer and runtime gates
        shell: pwsh
        run: |
          python tools/release.py verify-source
          if ($LASTEXITCODE -ne 0) { throw 'Source verification failed' }
          python tools/generate_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          python tools/installer_assets.py --matrix
          if ($LASTEXITCODE -ne 0) { throw 'Installer asset matrix failed' }
          python tools/release.py verify-installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer policy verification failed' }
          python -m unittest discover -s tools -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
          Push-Location source
          go test -count=100 ./...
          if ($LASTEXITCODE) { throw 'Go test x100 failed' }
          go vet ./...
          if ($LASTEXITCODE) { throw 'Go vet failed' }
          Pop-Location

      - name: Build LangTint.exe
        working-directory: source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\build | Out-Null
          go build -buildvcs=false -trimpath -ldflags="-H=windowsgui -s -w" -o ..\build\LangTint.exe .
          if ($LASTEXITCODE) { throw 'Go build failed' }

      - name: Stage deterministic portable ZIP for internal validation
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -c "from pathlib import Path; import sys; sys.path.insert(0,'tools'); import release; release.check_pe(Path('build/LangTint.exe'))"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime PE validation failed' }
          python tools/release.py stage --binary build/LangTint.exe --output stage --commit "$env:SOURCE_COMMIT"
          if ($LASTEXITCODE -ne 0) { throw 'Package staging failed' }
          python tools/release.py package --stage stage --output internal-dist
          if ($LASTEXITCODE -ne 0) { throw 'Internal package validation failed' }
          $portable = 'internal-dist\LangTint-v1.7.1-Windows10-x64-unsigned.zip'
          if (-not (Test-Path $portable)) { throw 'Internal portable package missing' }

      - name: Bootstrap verified Inno Setup 7.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .inno | Out-Null
          gh release download $env:INNO_TAG --repo jrsoftware/issrc --pattern $env:INNO_ASSET --dir .inno
          if ($LASTEXITCODE) { throw 'Unable to download pinned Inno Setup release asset' }
          $asset = Join-Path $PWD ".inno\$env:INNO_ASSET"
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) { throw "Inno Setup SHA-256 mismatch: $actual" }
          $sig = Get-AuthenticodeSignature $asset
          if ($sig.Status -ne 'Valid') { throw "Inno Setup Authenticode status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw "Unexpected Inno Setup publisher: $($sig.SignerCertificate.Subject)" }
          $p = Start-Process -FilePath $asset -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install exit code $($p.ExitCode)" }
          $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter ISCC.exe -File -Recurse | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after verified Inno Setup installation' }
          "ISCC_PATH=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile and deep-check LangTint Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\installer\build | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\LangTint.exe packaging\installer\build\LangTint.exe
          Copy-Item packaging\windows\LangTint.exe.manifest packaging\installer\build\LangTint.exe.manifest
          & "$env:ISCC_PATH" /Qp packaging\installer\LangTint.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exit code $LASTEXITCODE" }
          $setupSource = 'packaging\installer\output\LangTint-Setup-x64.exe'
          if (-not (Test-Path $setupSource)) { throw 'Installer output missing' }
          python -c "from pathlib import Path; import sys; sys.path.insert(0,'tools'); import release; release.check_pe(Path(r'$setupSource'))"
          if ($LASTEXITCODE -ne 0) { throw 'Setup PE validation failed' }
          python tools/installer_assets.py --scan-exe $setupSource
          if ($LASTEXITCODE -ne 0) { throw 'Compiled installer asset scan failed' }
          $sig = Get-AuthenticodeSignature $setupSource
          if ($sig.Status -notin @('NotSigned','UnknownError')) { throw "Unexpected preview signing state: $($sig.Status)" }
          Copy-Item $setupSource dist\LangTint-Setup.exe

      - name: Execute public Setup startup smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist\LangTint-Setup.exe').Path
          $log = Join-Path $PWD 'release-setup-startup-smoke.log'
          $args = @('/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$log")
          $p = Start-Process -FilePath $setup -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(30000)) {
            try { $p.Kill() } catch {}
            throw 'Release Setup startup smoke test timed out'
          }
          if (-not (Test-Path $log)) { throw 'Release Setup did not create an Inno Setup log' }
          $text = Get-Content $log -Raw
          foreach ($needle in @('Could not decompress the image','invalid compressed data','data error (-3)')) {
            if ($text.Contains($needle)) { throw "Release Setup image failure detected: $needle" }
          }
          $uninstall = Join-Path $env:LOCALAPPDATA 'Programs\LangTint\unins000.exe'
          if (Test-Path $uninstall) {
            $u = Start-Process -FilePath $uninstall -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            if (-not $u.WaitForExit(30000)) {
              try { $u.Kill() } catch {}
              throw 'Release smoke-test cleanup uninstall timed out'
            }
          }

      - name: Final public release hashes
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          if ($files.Count -ne 1 -or $files[0].Name -ne 'LangTint-Setup.exe') { throw 'Public release must contain exactly one binary' }
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'dist\SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
          Get-Content dist\SHA256SUMS.txt

      - name: Create draft prerelease only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          # A successful empty list means no release. Authentication/network
          # failures must never be treated as permission to create a release.
          $releaseJson = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect existing releases' }
          $releasePages = $releaseJson | ConvertFrom-Json -NoEnumerate
          if ($releasePages -isnot [array]) { throw 'Invalid release list response' }
          foreach ($page in $releasePages) {
            if ($page -isnot [array]) { throw 'Invalid release page response' }
            foreach ($release in $page) {
              if ($release.tag_name -ceq $env:REQUESTED_TAG) {
                throw 'Release already exists; refusing to overwrite it'
              }
            }
          }
          @"
          Windows 10 x64 release candidate.

          Download: LangTint-Setup.exe

          One installer. No portable/developer files in the public release.

          Built from commit $env:GITHUB_SHA.
          Source hashes, 100x runtime tests, deep installer asset checks and Windows startup smoke passed in CI.
          SignPath is not active yet; Windows may warn about an unknown publisher.
          This draft must pass real Windows 10 desktop acceptance before promotion to stable.
          "@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $env:REQUESTED_TAG dist\LangTint-Setup.exe dist\SHA256SUMS.txt --target $env:GITHUB_SHA --draft --prerelease --title "LangTint $env:REQUESTED_TAG" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Draft release creation failed' }
