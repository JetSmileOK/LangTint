name: Temporary product-polish source export
on:
  push:
    branches: [product-polish-v1.7.1]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LangTint-product-polish-source-${{ github.sha }}
          path: |
            source/**
            packaging/**
            tools/**
            docs/**
            assets/**
            .github/workflows/build.yml
            .github/workflows/release.yml
            README.md
            README.ru.md
            CHANGELOG.md
            LICENSE
          if-no-files-found: error
          retention-days: 1
